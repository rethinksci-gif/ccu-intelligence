# DeepSeek models, prices and per-stage roles for the research workflow.
#
# Prices are USD per million tokens, copied from the official pricing page on the date below.
# Budget reservations and the "upper bound" cost charge every input token as a peak-hour cache miss
# and every output token (including reasoning) at the peak output rate. Off-peak rates are half.
# A model missing from this table cannot be used: unknown prices cannot be budgeted.
endpoint: https://api.deepseek.com
source: https://api-docs.deepseek.com/quick_start/pricing/
checked: '2026-10-09'
# UTC, Monday–Friday; all other hours (and Chinese public holidays) are off-peak.
peak_hours_utc: [[1, 4], [6, 10]]
models:
  deepseek-flash:
    # DeepSeek-V4.1-Flash. The legacy alias deepseek-v4-flash is retired and routed here.
    input_cache_hit_peak: 0.006
    input_cache_miss_peak: 0.30
    output_peak: 1.20
  deepseek-v4-pro:
    # Historical cost accounting only; runtime policy forbids new calls.
    # DeepSeek-V4-Pro-0813.
    input_cache_hit_peak: 0.044
    input_cache_miss_peak: 1.32
    output_peak: 3.96
# Conservative ceilings used for reservations. They may only be raised above the official peak
# rates (never lowered); the loader rejects anything below the table above.
rate_ceilings:
  deepseek-flash: {input: 0.30, output: 1.20}
  deepseek-v4-pro: {input: 1.32, output: 3.96}
# All stages use deepseek-flash only. LLM_SCREENING_MODEL and LLM_MODEL may only name Flash.
# Other prices above are retained solely for historical audit calculations. Thinking output counts toward
# max_output_tokens and is billed as output. Paid run 1 (2026-10-09): two enrichments spent all 12,000
# output tokens on reasoning, so quality stages allow 32,000.
roles:
  screening: {tier: screening, thinking: false, max_output_tokens: 2000}
  enrichment: {tier: strong, thinking: true, max_output_tokens: 32000}
  verification: {tier: strong, thinking: true, max_output_tokens: 32000}
  dedup: {tier: strong, thinking: true, max_output_tokens: 6000}
  synthesis: {tier: strong, thinking: true, max_output_tokens: 32000}
defaults:
  screening: deepseek-flash
  strong: deepseek-flash
# Average tokens per call (input, output including reasoning), rounded up from paid run 37929580610 (2026-10-09).
# Used only for the dry-run cost projection; budgets and reservations never use these.
estimates:
  screening: {input: 4000, output: 300}
  dedup: {input: 6000, output: 3000}
  enrichment: {input: 4000, output: 9500}
  verification: {input: 2700, output: 8000}
  synthesis: {input: 14000, output: 15000}
