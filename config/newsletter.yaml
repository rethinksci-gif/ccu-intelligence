# Selection and layout for the biweekly research draft. Category keys must exist in taxonomy.yaml;
# the analysis prompt lists them with these descriptions and the model picks one from the content.
threshold: 5            # minimum 0–10 decision-value score for enrichment and the draft
per_category_cap: 5     # as in the reference digest; never fill a category with weak items
overall_cap: 16
max_takeaways: 5        # opening takeaways, each from a distinct category
headline_score_cap: 6   # a headline-only input cannot score above useful context
categories:
  commercialization:
    name: Projects, finance & deployment
    description: FIDs, financing, offtakes, construction, commissioning, operation, delays, cancellations,
      and partnerships with a stated scale for CO2-to-product plants.
  conversion:
    name: Conversion technology
    description: Electrochemical (CO2 electrolysis), thermocatalytic (hydrogenation), photochemical,
      biological and mineralization processes; catalysts, reactors and measured performance from lab to pilot.
  products:
    name: Products & markets
    description: E-fuels (e-methanol, e-SAF, e-kerosene, synthetic methane), chemicals, polymers and CO2-cured or
      carbonated building materials; demand, pricing, specifications and certification of CO2-derived products.
  economics_climate_policy:
    name: Economics, climate & policy
    description: Techno-economic analysis, life-cycle assessment and carbon accounting of CCU, and policy that changes
      CCU economics (EU RFNBO/RCF rules, ETS treatment of utilized CO2, US 45Q utilization and 45V, subsidies, standards).
  capture_supply:
    name: CO2 supply for utilization
    description: Capture integrated with conversion or explicitly supplying a utilization route; CO2 sourcing,
      purity, transport and hubs for use rather than storage.
