# Selection and layout for the biweekly research draft. Category keys must exist in taxonomy.yaml;
# the analysis prompt lists them with these descriptions and the model picks one from the content.
threshold: 5            # minimum 0–10 decision-value score for enrichment and the draft
per_category_cap: 5     # default per-category cap, counted per story; never fill a category with weak items
category_caps:          # per-category overrides
  conversion: 8
research_caps:          # strict per-section caps on research papers (never relaxed); the rest go to "Also noted"
  conversion: 4         # ranked by score, with full text counting half a point more than an abstract
target_min_items: 10    # aim for 10–15 stories: caps (never the threshold) are relaxed to reach 10 when enough qualify
overall_cap: 15
min_takeaways: 3        # aim for 3–5 takeaways when enough stories pass the threshold
max_takeaways: 5        # one per category first, then further stories scoring >= takeaway_extra_score
takeaway_extra_score: 7
headline_score_cap: 6   # a headline-only input cannot score above useful context
also_noted_min_score: 3 # relevant but unselected items at or above this score are listed (headline and link)
# Dedup keeps the most credible outlet: primary (company, government, paper) > major business press > trade press
# > regional and other press. Hostnames match exactly or as a parent domain.
outlet_tiers:
  major_business_press: [reuters.com, bloomberg.com, ft.com, wsj.com, economist.com, nikkei.com, asia.nikkei.com,
    cnbc.com, apnews.com, afp.com, handelsblatt.com, lesechos.fr, argusmedia.com, spglobal.com, icis.com,
    business-standard.com, economictimes.indiatimes.com, livemint.com, thehindubusinessline.com, caixinglobal.com,
    scmp.com, japantimes.co.jp, axios.com, politico.eu, politico.com, euractiv.com]
  trade_press: [carbonherald.com, hydrogen-central.com, biofuels-news.com, hellenicshippingnews.com, offshore-energy.biz,
    rechargenews.com, upstreamonline.com, tradewindsnews.com, chemanager-online.com, cen.acs.org, chemistryworld.com,
    greenairnews.com, sustainableaviationfuel.news, h2-view.com, hydrogeninsight.com, renewablesnow.com,
    biofuelsdigest.com, chemengonline.com, manifoldtimes.com, renewable-carbon.eu, bioenergy-news.com]
categories:
  commercialization:
    name: Projects, finance & deployment
    description: FIDs, financing, offtakes, construction, commissioning, operation, delays, cancellations,
      and partnerships with a stated scale for CO2-to-product plants.
  conversion:
    name: Conversion technology
    description: Electrochemical (CO2 electrolysis), thermocatalytic (hydrogenation), photochemical,
      biological and mineralization processes; catalysts, reactors and measured performance from lab to pilot.
  products:
    name: Products & markets
    description: E-fuels (e-methanol, e-SAF, e-kerosene, synthetic methane), chemicals, polymers and CO2-cured or
      carbonated building materials; demand, pricing, specifications and certification of CO2-derived products.
  economics_climate_policy:
    name: Economics, climate & policy
    description: Techno-economic analysis, life-cycle assessment and carbon accounting of CCU, and policy that changes
      CCU economics (EU RFNBO/RCF rules, ETS treatment of utilized CO2, US 45Q utilization and 45V, subsidies, standards).
  capture_supply:
    name: CO2 supply for utilization
    description: Capture integrated with conversion or explicitly supplying a utilization route; CO2 sourcing,
      purity, transport and hubs for use rather than storage.
