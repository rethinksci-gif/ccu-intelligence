name: Collect evidence candidates
on:
  # Manual-only for the initial public deployment; scheduled collection is disabled.
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ccu-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock
      - name: Restore historical working state
        run: bash scripts/restore-state.sh
      - name: Initialize and collect metadata
        env:
          CCU_CONTACT_EMAIL: ${{ secrets.CCU_CONTACT_EMAIL }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: |
          python -m ccu_intelligence.cli init
          python -m ccu_intelligence.cli collect
          python -m ccu_intelligence.cli status > data/runtime/last-run.json
          python -m ccu_intelligence.cli validate
      - uses: actions/upload-artifact@v7
        with:
          name: collection-state
          path: |
            data/runtime/intelligence.sqlite
            data/runtime/last-run.json
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: review-candidates
          path: data/candidates/
          retention-days: 30
