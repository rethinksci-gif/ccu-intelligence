name: Validate and deploy site
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      ASTRO_TELEMETRY_DISABLED: '1'
      SITE_URL: https://${{ github.repository_owner }}.github.io
      BASE_PATH: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: npm ci
      - run: pip install -r requirements.lock
      - run: ruff check src/ccu_intelligence tests scripts
      - run: pytest -q tests automation/tests
      - run: python -m ccu_intelligence.cli validate
      - name: Validate generated data is current
        run: |
          python -m ccu_intelligence.cli export
          git diff --exit-code -- public/data/intelligence.json
      - run: python scripts/validate_workflows.py
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: python3 automation/validate.py
      - name: Record exact build for live confirmation
        run: python3 automation/confirm.py prepare --root dist
      - uses: actions/upload-artifact@v7
        with:
          name: publication-receipt
          path: automation/expected-receipt.json
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy reviewed main branch
        id: deployment
        uses: actions/deploy-pages@v5

      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: publication-receipt
          path: automation
      - name: Confirm live receipt and every published page
        env:
          LIVE_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python3 automation/confirm.py confirm --base "$LIVE_BASE"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: live-confirmation
          path: automation/confirmation.json
          if-no-files-found: ignore
