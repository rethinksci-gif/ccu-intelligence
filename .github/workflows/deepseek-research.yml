name: Optional DeepSeek biweekly research
on:
  # Deliberately no schedule. Every run is a manual dispatch from the default branch.
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run makes zero paid calls; paid needs the repository opt-in variable'
        type: choice
        options: [dry-run, paid]
        default: dry-run
      max_analyses:
        description: 'Maximum NEW screening analyses (0–60, hard cap 60)'
        type: number
        default: 60
      token_budget:
        description: 'Total token budget including reservations (hard cap 5,000,000)'
        type: number
        default: 2000000
      max_spend_usd:
        description: 'USD spending cap per run at ceiling rates (0–5, hard cap 5)'
        type: string
        default: '5'
      screening_model:
        description: 'Stage 1 screening model (must be in config/models.yaml)'
        type: choice
        options: [deepseek-flash, deepseek-v4-pro]
        default: deepseek-flash
      strong_model:
        description: 'Enrichment, verification, dedup and synthesis model'
        type: choice
        options: [deepseek-v4-pro, deepseek-flash]
        default: deepseek-v4-pro
permissions:
  contents: read
concurrency:
  group: ccu-deepseek-research
  cancel-in-progress: false
env:
  PYTHONPATH: src
  LLM_SCREENING_MODEL: ${{ inputs.screening_model }}
  LLM_MODEL: ${{ inputs.strong_model }}
  LLM_BASE_URL: https://api.deepseek.com
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
  MAX_ANALYSES: ${{ inputs.max_analyses }}
  TOKEN_BUDGET: ${{ inputs.token_budget }}
  MAX_SPEND_USD: ${{ inputs.max_spend_usd }}
jobs:
  dry-run:
    # No environment and no LLM secret: this job can never make a paid request.
    if: inputs.mode == 'dry-run' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RESEARCH_MODE: dry-run
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock
      - name: Validate run configuration
        run: python scripts/deepseek-research.py --check
      - name: Restore trusted response cache (read-only)
        uses: actions/cache/restore@v6
        with:
          path: data/runtime/llm-cache
          key: deepseek-responses-v5-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            deepseek-responses-v5-
      - name: Research dry run (no LLM secret)
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          CCU_CONTACT_EMAIL: ${{ secrets.CCU_CONTACT_EMAIL }}
        run: python scripts/deepseek-research.py
      - name: Retain dry-run report for manual review
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deepseek-dry-run-${{ github.run_id }}-${{ github.run_attempt }}
          # Extracted full text lives in data/runtime/fulltext-cache and is never uploaded.
          path: data/runtime/deepseek-research/
          retention-days: 30
          if-no-files-found: ignore
      - name: Validate publication boundary remains intact
        run: python -m ccu_intelligence.cli validate

  paid:
    # Never run secret-bearing processing from a PR, tag, rerun or non-default branch.
    # Safety model: manual dispatch only, the deepseek-paid environment's main-branch deployment policy,
    # the USD 5 hard cap (reserved at ceiling rates before every request) and a prepaid DeepSeek balance.
    # The environment deliberately has no required reviewers.
    if: >-
      inputs.mode == 'paid' && vars.CCU_ENABLE_DEEPSEEK == 'true' && github.run_attempt == 1 &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: deepseek-paid
    env:
      RESEARCH_MODE: paid
      ALLOW_PAID: ${{ vars.CCU_ENABLE_DEEPSEEK }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock
      - name: Validate opt-in and run configuration before accessing secrets
        run: python scripts/deepseek-research.py --check
      - name: Restore trusted response cache
        uses: actions/cache/restore@v6
        with:
          path: data/runtime/llm-cache
          key: deepseek-responses-v5-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            deepseek-responses-v5-
      - name: Bounded paid research
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          CCU_CONTACT_EMAIL: ${{ secrets.CCU_CONTACT_EMAIL }}
        run: python scripts/deepseek-research.py
      - name: Persist response cache (including completed analyses before failure)
        if: always() && !cancelled()
        uses: actions/cache/save@v6
        with:
          path: data/runtime/llm-cache
          key: deepseek-responses-v5-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Retain research draft and audit ledger for manual review
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deepseek-review-${{ github.run_id }}-${{ github.run_attempt }}
          # Extracted full text lives in data/runtime/fulltext-cache and is never uploaded.
          path: data/runtime/deepseek-research/
          retention-days: 30
          if-no-files-found: ignore
      - name: Validate publication boundary remains intact
        run: python -m ccu_intelligence.cli validate
