name: Optional DeepSeek biweekly research
on:
  # Deliberately no schedule. Add one only after explicit owner approval.
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run makes zero paid calls; paid requires repository opt-in'
        type: choice
        options: [dry-run, paid]
        default: dry-run
      max_analyses:
        description: 'Maximum NEW article analyses (0–30)'
        type: string
        default: '30'
      token_budget:
        description: 'Total token budget including retry reservations'
        type: string
        default: '120000'
      max_spend_usd:
        description: 'Conservative USD reservation cap per run'
        type: string
        default: '0.50'
      rate_ceiling:
        description: 'USD per million tokens, at least the current higher peak rate'
        type: string
        default: '1.20'
permissions:
  contents: read
concurrency:
  group: ccu-deepseek-research
  cancel-in-progress: false
jobs:
  research:
    # Never run secret-bearing processing from a PR, tag, or non-default branch.
    if: github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: src
      LLM_MODEL: deepseek-flash
      LLM_BASE_URL: https://api.deepseek.com
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock
      - name: Validate opt-in and run configuration before accessing secrets
        env:
          RESEARCH_MODE: ${{ inputs.mode }}
          ALLOW_PAID: ${{ vars.CCU_ENABLE_DEEPSEEK }}
          MAX_ANALYSES: ${{ inputs.max_analyses }}
          TOKEN_BUDGET: ${{ inputs.token_budget }}
          MAX_SPEND_USD: ${{ inputs.max_spend_usd }}
          RATE_CEILING: ${{ inputs.rate_ceiling }}
        run: python scripts/deepseek-research.py --check
      - name: Restore trusted response cache
        uses: actions/cache/restore@v4
        with:
          path: data/runtime/llm-cache
          key: deepseek-responses-v3-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            deepseek-responses-v3-
      - name: Research dry run (no LLM secret)
        if: inputs.mode == 'dry-run'
        env:
          RESEARCH_MODE: dry-run
          MAX_ANALYSES: ${{ inputs.max_analyses }}
          TOKEN_BUDGET: ${{ inputs.token_budget }}
          MAX_SPEND_USD: ${{ inputs.max_spend_usd }}
          RATE_CEILING: ${{ inputs.rate_ceiling }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          CCU_CONTACT_EMAIL: ${{ secrets.CCU_CONTACT_EMAIL }}
        run: python scripts/deepseek-research.py
      - name: Bounded paid research (explicit opt-in only)
        if: inputs.mode == 'paid' && vars.CCU_ENABLE_DEEPSEEK == 'true' && github.run_attempt == 1
        env:
          RESEARCH_MODE: paid
          ALLOW_PAID: ${{ vars.CCU_ENABLE_DEEPSEEK }}
          MAX_ANALYSES: ${{ inputs.max_analyses }}
          TOKEN_BUDGET: ${{ inputs.token_budget }}
          MAX_SPEND_USD: ${{ inputs.max_spend_usd }}
          RATE_CEILING: ${{ inputs.rate_ceiling }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          CCU_CONTACT_EMAIL: ${{ secrets.CCU_CONTACT_EMAIL }}
        run: python scripts/deepseek-research.py
      - name: Persist response cache (including completed analyses before failure)
        if: always() && !cancelled()
        uses: actions/cache/save@v4
        with:
          path: data/runtime/llm-cache
          key: deepseek-responses-v3-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Retain research draft and audit ledger for manual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/runtime/deepseek-research/
          retention-days: 30
          if-no-files-found: ignore
      - name: Validate publication boundary remains intact
        run: python -m ccu_intelligence.cli validate
